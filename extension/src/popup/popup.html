<!doctype html>
<html lang="bn">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Bangla Accessibility Assistant</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main class="popup">
      <h1>বাংলা অ্যাক্সেসিবিলিটি সহকারী</h1>

      <section class="control-panel" aria-labelledby="translation-heading">
        <div>
          <h2 id="translation-heading">DOM Translation</h2>
          <p id="statusText">Status loading</p>
        </div>

        <button id="toggleButton" type="button">Start</button>
      </section>

      <a class="settings-link" href="../settings/settings.html" target="_blank">সেটিংস খুলুন</a>
      <section aria-labelledby="navigation-heading">
        <h2 id="navigation-heading">পৃষ্ঠায় নেভিগেশন</h2>
        <button id="pageNavigator" type="button">পৃষ্ঠার অংশগুলো</button>
        <p>কিবোর্ড: <kbd data-shortcut="navigator">Alt+Shift+Z</kbd> — ওয়েবপৃষ্ঠায় ফোকাস রেখে চাপুন।</p>
        <p id="navigationStatus" role="status" aria-live="polite"></p>
      </section>
      <section aria-labelledby="summary-heading">
        <h2 id="summary-heading">বাংলা সারাংশ</h2>
        <button id="pageSummary" type="button">পৃষ্ঠার সারাংশ — <kbd data-shortcut="pageSummary">Alt+Shift+A</kbd></button>
        <button id="regionSummary" type="button">ফোকাসের অংশ — <kbd data-shortcut="regionSummary">Alt+Shift+S</kbd></button>
        <p id="summaryStatus" role="status" aria-live="polite"></p>
      </section>
    </main>

    <script src="../content/keybindings.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
