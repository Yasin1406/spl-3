<!doctype html>
<html lang="bn">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>সহায়কের সেটিংস</title>
    <link rel="stylesheet" href="settings.css" />
  </head>
  <body>
    <main>
      <h1>বাংলা অ্যাক্সেসিবিলিটি সহায়কের সেটিংস</h1>
      <p>এই সেটিংস শুধু আপনার ব্রাউজারে সংরক্ষিত থাকে।</p>

      <form id="settingsForm">
        <fieldset>
          <legend>মূল সহায়তা</legend>
          <label class="check-row">
            <input id="assistantEnabled" name="assistantEnabled" type="checkbox" />
            ওয়েবপেজের অ্যাক্সেসিবিলিটি সমস্যা পরীক্ষা করুন
          </label>
        </fieldset>

        <fieldset>
          <legend>AI অনুবাদ</legend>
          <label class="check-row">
            <input id="aiTranslationEnabled" name="aiTranslationEnabled" type="checkbox" />
            নিয়মে অনুবাদ সম্ভব না হলে ব্যাকএন্ডের AI প্রদানকারী ব্যবহার করুন
          </label>
          <label for="backendUrl">স্থানীয় ব্যাকএন্ড ঠিকানা</label>
          <input id="backendUrl" name="backendUrl" type="url" value="http://127.0.0.1:3000" aria-describedby="backendHelp" />
          <p id="backendHelp">Groq, Mistral ও Cerebras API key শুধু ব্যাকএন্ডে থাকবে, এক্সটেনশনে নয়।</p>
        </fieldset>

        <fieldset>
          <legend>ঘোষণার বিস্তারিত</legend>
          <label><input name="announcementDetail" type="radio" value="brief" /> সংক্ষিপ্ত</label>
          <label><input name="announcementDetail" type="radio" value="standard" /> সাধারণ</label>
          <label><input name="announcementDetail" type="radio" value="detailed" /> বিস্তারিত</label>
        </fieldset>

        <button type="submit">সেটিংস সংরক্ষণ করুন</button>
        <p id="saveStatus" role="status" aria-live="polite"></p>
      </form>
    </main>
    <script src="settings.js"></script>
  </body>
</html>
